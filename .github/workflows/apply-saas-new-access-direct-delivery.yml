name: Apply SaaS new-access direct delivery

"on":
  push:
    branches:
      - "fix/saas-new-access-direct-delivery"

permissions:
  contents: write

jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.py config.py

      - name: Apply deterministic patch
        run: python tools/apply_saas_new_access_direct_delivery.py

      - name: Correct generated static assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_saas_new_access_delivery.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import unittest\n",
              "import inspect\nimport unittest\n",
              1,
          )
          old = '''        source = saas.__file__
                  self.assertIsNotNone(source)
                  text = open(source, encoding="utf-8").read()
                  start = text.index("async def saas_new_access_check")
                  end = text.index("async def _load_checkout_context", start)
                  function_text = text[start:end]
          '''
          new = '''        function_text = inspect.getsource(
                      saas.saas_new_access_check,
                  )
          '''
          if old not in text:
              raise RuntimeError("generated static assertion anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused delivery tests
        run: python -m unittest tests.test_saas_new_access_delivery -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet -- bot/handlers/user/payments/saas.py tests/test_saas_new_access_delivery.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/user/payments/saas.py tests/test_saas_new_access_delivery.py
          git commit -m "Use direct delivery for in-bot payment checks"
          git push origin HEAD:fix/saas-new-access-direct-delivery
