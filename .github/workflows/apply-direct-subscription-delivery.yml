name: Apply direct subscription delivery

"on":
  push:
    branches:
      - "fix/saas-subscription-direct-delivery"

permissions:
  contents: write

jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.py config.py

      - name: Apply deterministic patch
        run: python tools/run_direct_subscription_delivery.py

      - name: Run payment-return tests
        run: python -m unittest tests.test_payment_return_handler -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet -- bot/handlers/user/payments/payment_return.py tests/test_payment_return_handler.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/user/payments/payment_return.py tests/test_payment_return_handler.py
          git commit -m "Deliver SaaS subscription before local projection"
          git push origin HEAD:fix/saas-subscription-direct-delivery
