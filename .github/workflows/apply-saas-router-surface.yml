name: Apply SaaS router surface

"on":
  push:
    branches:
      - "fix/saas-router-surface"

permissions:
  contents: write

jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare config
        run: cp config.example.py config.py

      - name: Apply deterministic patch
        run: python tools/apply_saas_router_surface.py

      - name: Run focused router tests
        run: python -m unittest tests.test_saas_router_surface -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet -- bot/handlers/user/start.py bot/handlers/user/payments/saas.py tests/test_saas_router_surface.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/user/start.py bot/handlers/user/payments/saas.py tests/test_saas_router_surface.py
          git commit -m "Remove legacy commercial routes from SaaS mode"
          git push origin HEAD:fix/saas-router-surface
