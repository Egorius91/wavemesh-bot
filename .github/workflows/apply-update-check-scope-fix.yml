name: Apply update-check scope fix

"on":
  push:
    branches:
      - "fix/update-check-keyboard-scope"

permissions:
  contents: write

jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python tools/apply_update_check_scope_fix.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_scheduler_update_notifications.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- bot/services/scheduler.py tests/test_scheduler_update_notifications.py; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/services/scheduler.py tests/test_scheduler_update_notifications.py
          git commit -m "Fix update checker keyboard scope"
          git push origin HEAD:fix/update-check-keyboard-scope
